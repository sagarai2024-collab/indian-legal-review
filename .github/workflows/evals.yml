name: evals
on: [push, pull_request]
jobs:
  deterministic:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y poppler-utils
      - run: pip install pyyaml python-docx jinja2
      - name: Pre-scan layer (injection detection, scope, rule nomination)
        run: python evals/score.py --layer prescan
      - name: Drafting tests (protection floor, overrides, output checks)
        run: python evals/test_draft.py
      - name: Verifier self-test on the committed sample report
        shell: bash
        run: |
          mkdir -p scan && python skills/review-agreement/scripts/prescan.py evals/cases/injection_film_assignment.txt --out scan/prescan.json
          python skills/review-agreement/scripts/verify_report.py examples/sample-report-injection-case.json --prescan scan/prescan.json
